[pytest]
testpaths = tests
asyncio_mode = auto

# Silenciar warnings de librerías externas (no controlamos su código).
# kerykeion 5.12.8 usa `datetime.utcnow()` que está deprecated en 3.12+;
# confiamos en que upstream lo arregle. Cualquier warning del propio bot
# sí sigue apareciendo.
filterwarnings =
    ignore::DeprecationWarning:kerykeion.*
